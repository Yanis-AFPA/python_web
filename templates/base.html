<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MediTrack - Gestion Clinique{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0d9488', // Teal 600
                        secondary: '#64748b', // Slate 500
                    }
                }
            }
        }

        // Immediate Auth Check
        const t = localStorage.getItem('token');
        const p = window.location.pathname;
        if (!t && p !== '/login' && p !== '/') {
            window.location.href = '/login';
        }
    </script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Custom scrollbar for sidebar if needed */
        .sidebar-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-scroll::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 3px;
        }
    </style>
    {% block head %}{% endblock %}
</head>

<body class="bg-slate-50 font-sans text-slate-800 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-20">
        <!-- Logo -->
        <div class="h-16 flex items-center px-6 border-b border-slate-800">
            <div class="text-xl font-bold tracking-wide flex items-center gap-2">
                <i class="fas fa-heartbeat text-teal-500"></i>
                <span>Medi<span class="text-teal-500">Track</span></span>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 py-6 px-3 space-y-1 overflow-y-auto sidebar-scroll" id="sidebar-nav">
            <a href="/dashboard"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors group">
                <i class="fas fa-chart-pie w-5 text-center group-hover:text-teal-400 transition-colors"></i>
                <span class="font-medium">Dashboard</span>
            </a>
            <a href="/calendar"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors group">
                <i class="fas fa-calendar-alt w-5 text-center group-hover:text-teal-400 transition-colors"></i>
                <span class="font-medium">Calendrier / RDV</span>
            </a>
            <a href="/patients"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors group">
                <i class="fas fa-folder w-5 text-center group-hover:text-teal-400 transition-colors"></i>
                <span class="font-medium">Dossiers Médicaux</span>
            </a>
            <a href="/settings"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors group">
                <i class="fas fa-cog w-5 text-center group-hover:text-teal-400 transition-colors"></i>
                <span class="font-medium">Paramètres</span>
            </a>
        </nav>
        <script>
            // Active Link Logic
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('#sidebar-nav a');
            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    // Remove inactive classes
                    link.classList.remove('text-slate-400', 'hover:text-white', 'hover:bg-slate-800');
                    // Add active classes
                    link.classList.add('bg-teal-600', 'text-white', 'shadow-md', 'shadow-teal-900/20');
                    // Fix icon color in active state? The icon is fine as white (text-white applies)
                }
            });
        </script>

        <!-- User Profile (Bottom) -->
        <div id="sidebar-profile" class="p-4 border-t border-slate-800 invisible">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-teal-500 flex items-center justify-center text-white font-bold">
                    JD
                </div>
                <div>
                    <h4 id="sidebar-user-name" class="text-sm font-semibold">User</h4>
                    <button id="btn-logout" class="text-xs text-red-400 hover:text-red-300">Déconnexion</button>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden">

        <!-- Top Header (Optional simple header) -->
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 z-10">
            <h1 class="text-2xl font-bold text-slate-800">{% block header_title %}Overview{% endblock %}</h1>
            <div class="flex items-center gap-4">
                <button class="p-2 text-slate-400 hover:text-indigo-600 transition-colors">
                    <i class="fas fa-bell"></i>
                </button>
            </div>
        </header>

        <!-- Page Content -->
        <div class="flex-1 overflow-auto p-8 relative">
            {% block content %}{% endblock %}
        </div>

    </main>

    <script>
        (() => {
            // Logout
            const btnLogout = document.getElementById('btn-logout');
            if (btnLogout) {
                btnLogout.addEventListener('click', () => {
                    localStorage.removeItem('token');
                    window.location.href = '/login';
                });
            }

            // Fetch user info for Sidebar (if logged in)
            const token = localStorage.getItem('token');
            const isLoginPage = window.location.pathname === '/login' || window.location.pathname === '/' || window.location.pathname === '/register';

            if (token && !isLoginPage) {
                fetch('/api/v1/auth/me', { headers: { 'Authorization': `Bearer ${token}` } })
                    .then(res => {
                        if (res.ok) return res.json();
                        throw new Error("Invalid token");
                    })
                    .then(user => {
                        // Show Profile Section
                        const profileSection = document.getElementById('sidebar-profile');
                        if (profileSection) profileSection.classList.remove('invisible');

                        const nameDisplay = document.getElementById('sidebar-user-name');
                        if (nameDisplay) {
                            if (user.first_name || user.last_name) {
                                let roleLabel = user.role;
                                if (roleLabel === 'manager') roleLabel = 'Médecin';
                                if (roleLabel === 'user') roleLabel = 'Secrétaire';
                                if (roleLabel === 'admin') roleLabel = 'Directeur';
                                if (roleLabel === 'super_admin') roleLabel = 'Directeur';

                                nameDisplay.innerHTML = `${user.first_name || ''} ${user.last_name || ''}<br><span class="text-xs text-slate-400 font-normal">${roleLabel}</span>`;
                            } else {
                                nameDisplay.textContent = user.email.split('@')[0];
                            }
                        }
                    })
                    .catch(err => {
                        console.error("Auth check failed", err);
                        localStorage.removeItem('token');
                        window.location.href = '/login';
                    });
            }
        })();
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
