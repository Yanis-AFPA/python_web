{% extends "base.html" %}

{% block title %}Calendrier - AgendaPro{% endblock %}
{% block header_title %}Mon Calendrier{% endblock %}

{% block head %}
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
<style>
    /* FullCalendar Customization overrides */
    :root {
        --fc-border-color: #e2e8f0;
        --fc-button-text-color: #fff;
        --fc-button-bg-color: #4f46e5;
        --fc-button-border-color: #4f46e5;
        --fc-button-hover-bg-color: #4338ca;
        --fc-button-hover-border-color: #4338ca;
        --fc-button-active-bg-color: #3730a3;
        --fc-button-active-border-color: #3730a3;
        --fc-event-bg-color: #eff6ff;
        --fc-event-border-color: #bfdbfe;
        --fc-event-text-color: #1e40af;
        --fc-today-bg-color: #f8fafc;
    }

    .fc-event {
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 4px;
        font-weight: 500;
        font-size: 0.85em;
    }

    .fc-toolbar-title {
        font-size: 1.5rem !important;
        font-weight: 700;
        color: #1e293b;
    }
</style>
{% endblock %}

{% block content %}

<div class="max-w-7xl mx-auto h-full flex flex-col gap-6">

    <!-- Actions Bar -->
    <div class="flex justify-end">
        <button id="btn-add-event"
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-lg shadow-lg shadow-indigo-500/30 transition-all flex items-center gap-2 transform hover:scale-105">
            <i class="fas fa-plus"></i>
            <span>Nouvel Événement</span>
        </button>
    </div>

    <!-- Calendar Card -->
    <div
        class="bg-white rounded-xl shadow-lg border border-slate-100 p-6 flex-1 relative overflow-hidden flex flex-col">
        <div id='calendar' class="flex-1"></div>
    </div>

</div>

<!-- Modal -->
<div id="event-modal"
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md transform scale-95 transition-all duration-300"
        id="modal-content">
        <div class="flex items-center justify-between p-6 border-b border-slate-100">
            <h3 class="text-xl font-bold text-slate-800">Ajouter un événement</h3>
            <button id="btn-close-modal" class="text-slate-400 hover:text-slate-600 transition-colors">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>

        <form id="event-form" class="p-6 space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Titre</label>
                <input type="text" name="title" required
                    class="w-full rounded-lg border-slate-200 focus:border-indigo-500 focus:ring-indigo-500 transition-colors bg-slate-50 px-4 py-2.5 text-sm">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Début</label>
                    <input type="datetime-local" name="start_date" required
                        class="w-full rounded-lg border-slate-200 focus:border-indigo-500 focus:ring-indigo-500 transition-colors bg-slate-50 px-4 py-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Fin</label>
                    <input type="datetime-local" name="end_date" required
                        class="w-full rounded-lg border-slate-200 focus:border-indigo-500 focus:ring-indigo-500 transition-colors bg-slate-50 px-4 py-2.5 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
                <textarea name="description" rows="3"
                    class="w-full rounded-lg border-slate-200 focus:border-indigo-500 focus:ring-indigo-500 transition-colors bg-slate-50 px-4 py-2.5 text-sm"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Pièce jointe</label>
                <input type="file" name="file"
                    class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
            </div>

            <div class="pt-2">
                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-indigo-500/20 transition-all transform active:scale-95">
                    Enregistrer
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // --- FullCalendar Setup ---
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            locale: 'fr',
            height: '100%',
            events: function (info, successCallback, failureCallback) {
                const token = localStorage.getItem('token');
                fetch('/events', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                    .then(response => {
                        if (response.status === 401) {
                            window.location.href = '/login';
                            return;
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (!data) return; // Redirected
                        // Map backend events to FullCalendar format
                        const events = data.map(event => ({
                            title: event.title,
                            start: event.start_date,
                            end: event.end_date,
                            extendedProps: {
                                description: event.description,
                                files: event.files
                            }
                        }));
                        successCallback(events);
                    })
                    .catch(error => {
                        console.error('Error fetching events:', error);
                        failureCallback(error);
                    });
            },
            eventClick: function (info) {
                const props = info.event.extendedProps;
                let msg = `Event: ${info.event.title}\nDesc: ${props.description || 'N/A'}`;
                if (props.files && props.files.length > 0) {
                    msg += `\nFiles: ${props.files.length} attached`;
                }
                alert(msg);
            },
            dateClick: function (info) {
                openModal();
                // Set default dates based on click
                // info.dateStr is YYYY-MM-DD for dayGrid

                // Helper to format date for datetime-local input (YYYY-MM-DDTHH:MM)
                const date = new Date(info.date);
                // Set start to 09:00 of clicked day
                date.setHours(9, 0);
                const startStr = date.toISOString().slice(0, 16); // Remove seconds

                // Set end to 10:00 of clicked day
                date.setHours(10, 0);
                const endStr = date.toISOString().slice(0, 16);

                const inputs = form.querySelectorAll('input[type="datetime-local"]');
                if (inputs.length >= 2) {
                    inputs[0].value = startStr;
                    inputs[1].value = endStr;
                }
            }
        });
        calendar.render();

        // --- Modal Logic ---
        const modal = document.getElementById('event-modal');
        const modalContent = document.getElementById('modal-content');
        const btnAdd = document.getElementById('btn-add-event');
        const btnClose = document.getElementById('btn-close-modal');
        const form = document.getElementById('event-form');

        function openModal() {
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        }

        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            form.reset();
        }

        btnAdd.addEventListener('click', openModal);
        btnClose.addEventListener('click', closeModal);

        // Click outside to close
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // --- Form Submission ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            // Ensure ISO format for dates if needed, but datetime-local usually allows standard processing
            // Debug: console.log([...formData]);

            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/events/', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                if (response.ok) {
                    // Refresh calendar
                    calendar.refetchEvents();
                    closeModal();
                    alert('Événement créé avec succès !');
                } else {
                    const err = await response.json();
                    alert('Erreur: ' + JSON.stringify(err));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Erreur réseau');
            }
        });
    });
</script>
{% endblock %}
