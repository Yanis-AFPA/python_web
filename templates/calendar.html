{% extends "base.html" %}

{% block title %}Calendrier - AgendaPro{% endblock %}
{% block header_title %}Mon Calendrier{% endblock %}

{% block head %}
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
<style>
    /* FullCalendar Customization overrides */
    :root {
        --fc-border-color: #e2e8f0;
        --fc-button-text-color: #fff;
        --fc-button-bg-color: #4f46e5;
        --fc-button-border-color: #4f46e5;
        --fc-button-hover-bg-color: #4338ca;
        --fc-button-hover-border-color: #4338ca;
        --fc-button-active-bg-color: #3730a3;
        --fc-button-active-border-color: #3730a3;
        --fc-event-bg-color: #eff6ff;
        --fc-event-border-color: #bfdbfe;
        --fc-event-text-color: #1e40af;
        --fc-today-bg-color: #f8fafc;
    }

    .fc-event {
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 4px;
        font-weight: 500;
        font-size: 0.85em;
    }

    .fc-toolbar-title {
        font-size: 1.5rem !important;
        font-weight: 700;
        color: #1e293b;
    }
</style>
{% endblock %}

{% block content %}

<div class="max-w-7xl mx-auto h-full flex flex-col gap-6">

    <!-- Actions Bar & Search -->
    <div
        class="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-100">

        <!-- Filters -->
        <div class="flex flex-1 items-center gap-4 w-full">
            <div class="relative flex-1 max-w-xs">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-search text-slate-400"></i>
                </div>
                <input type="text" id="searchDoctor" placeholder="Rechercher un médecin..."
                    class="block w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg leading-5 bg-white placeholder-slate-500 focus:outline-none focus:placeholder-slate-400 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-150 ease-in-out">
            </div>

            <select id="filterType"
                class="block w-40 pl-3 pr-10 py-2 text-base border-slate-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-lg">
                <option value="">Tous les types</option>
                <option value="consultation">Consultation</option>
                <option value="surgery">Chirurgie</option>
                <option value="meeting">Réunion</option>
                <option value="other">Autre</option>
            </select>
        </div>

        <button id="btn-print" onclick="window.print()"
            class="bg-slate-600 hover:bg-slate-700 text-white font-semibold py-2 px-6 rounded-lg shadow-lg shadow-slate-500/30 transition-all flex items-center gap-2 transform hover:scale-105 whitespace-nowrap">
            <i class="fas fa-print"></i>
            <span>Imprimer</span>
        </button>

        <button id="btn-add-event"
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-lg shadow-lg shadow-indigo-500/30 transition-all flex items-center gap-2 transform hover:scale-105 whitespace-nowrap">
            <i class="fas fa-plus"></i>
            <span>Nouvel Événement</span>
        </button>
    </div>

    <!-- Calendar Card -->
    <div
        class="bg-white rounded-xl shadow-lg border border-slate-100 p-6 flex-1 relative overflow-hidden flex flex-col print:shadow-none print:border-none print:p-0">
        <div id='calendar' class="flex-1"></div>
    </div>

</div>

<!-- Print Styles -->
<style>
    @media print {

        /* Hide everything except calendar */
        body * {
            visibility: hidden;
        }

        #calendar,
        #calendar * {
            visibility: visible;
        }

        /* Position calendar at top left */
        #calendar {
            position: absolute;
            left: 0;
            top: 0;
            width: 100% !important;
            height: 100% !important;
        }

        /* Specific adjustments for FullCalendar print */
        .fc-header-toolbar {
            display: none !important;
            /* Hide navigation buttons */
        }

        .fc-toolbar-title {
            display: block !important;
            /* Keep title (Month/Year) */
            visibility: visible !important;
            font-size: 24pt !important;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Ensure events have color */
        .fc-event {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
    }
</style>

<!-- Modal -->
<div id="event-modal"
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md transform scale-95 transition-all duration-300"
        id="modal-content">
        <div class="flex items-center justify-between p-6 border-b border-slate-100">
            <h3 class="text-xl font-bold text-slate-800">Ajouter un événement</h3>
            <button id="btn-close-modal" class="text-slate-400 hover:text-slate-600 transition-colors">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>

        <form id="event-form" class="p-6 space-y-5">
            <!-- Title (Optional/Hidden for Consultation) -->
            <div class="hidden">
                <label class="block text-sm font-medium text-slate-700 mb-1">Titre</label>
                <input type="text" name="title"
                    class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Type de RDV</label>
                    <select name="event_type" id="eventType"
                        class="w-full rounded-md border-slate-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm">
                        <option value="consultation">Consultation</option>
                        <option value="surgery">Chirurgie / Bloc</option>
                        <option value="meeting">Réunion / Staff</option>
                        <option value="other">Autre</option>
                    </select>
                </div>
                <!-- Doctor Select: Hidden by default, shown for Admin/Secretary -->
                <div id="doctorField" class="hidden">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Médecin</label>
                    <select name="owner_id" id="eventDoctor"
                        class="w-full rounded-md border-slate-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm">
                        <option value="">-- Assigner --</option>
                        <!-- Populated JS -->
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Patient</label>
                <select name="patient_id" id="eventPatient"
                    class="w-full rounded-md border-slate-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm">
                    <option value="">-- Aucun / Personnel --</option>
                    <!-- Populated via JS -->
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Début</label>
                    <input type="datetime-local" name="start_date" id="eventStart" required
                        class="w-full rounded-md border-slate-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Fin (Optionnel, +1h par défaut)</label>
                    <input type="datetime-local" name="end_date" id="eventEnd"
                        class="w-full rounded-md border-slate-300 shadow-sm focus:border-teal-500 focus:ring-teal-500 sm:text-sm">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
                <textarea name="description" rows="3"
                    class="w-full rounded-lg border-slate-200 focus:border-indigo-500 focus:ring-indigo-500 transition-colors bg-slate-50 px-4 py-2.5 text-sm"></textarea>
            </div>

            <div id="field-file-upload">
                <label class="block text-sm font-medium text-slate-700 mb-1">Pièce jointe</label>
                <input type="file" name="file"
                    class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" name="is_public" id="input-is-public"
                    class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                <label for="input-is-public" class="text-sm font-medium text-slate-700">Visibilité Publique (Soumis à
                    validation)</label>
            </div>

            <div class="pt-2">
                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-indigo-500/20 transition-all transform active:scale-95">
                    Enregistrer
                </button>
            </div>
        </form>
    </div>
</div>

<!-- View/Approve Modal -->
<div id="view-modal"
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 relative">
        <button onclick="closeViewModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i
                class="fas fa-times"></i></button>

        <div id="view-content" class="space-y-4">
            <!-- Populated via JS -->
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', async function () {
        const token = localStorage.getItem('token');

        // Populate Patients Dropdown
        try {
            const res = await fetch('/api/v1/patients/', { headers: { 'Authorization': `Bearer ${token}` } });
            if (res.ok) {
                const patients = await res.json();
                const patientSelect = document.getElementById('eventPatient');
                patients.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = `${p.last_name} ${p.first_name}`;
                    patientSelect.appendChild(opt);
                });
            }
        } catch (e) { console.error("Could not load patients", e); }

        // Populate Doctors Dropdown & Check User Role
        let currentUser = null;
        try {
            const res = await fetch('/api/v1/auth/me', { headers: { 'Authorization': `Bearer ${token}` } });
            if (res.ok) {
                currentUser = await res.json();

                // If Secretary (user) or Admin, load doctors and show select
                if (['user', 'admin', 'super_admin'].includes(currentUser.role)) {
                    const docField = document.getElementById('doctorField');
                    if (docField) docField.classList.remove('hidden');

                    const resDoc = await fetch('/api/v1/users/doctors', { headers: { 'Authorization': `Bearer ${token}` } });
                    if (resDoc.ok) {
                        const doctors = await resDoc.json();
                        const docSelect = document.getElementById('eventDoctor');
                        doctors.forEach(d => {
                            const opt = document.createElement('option');
                            opt.value = d.id;
                            // Label construction: First Last
                            let label = `${d.first_name || ''} ${d.last_name || ''}`.trim();
                            if (!label) label = d.email;
                            if (d.specialty) label += ` (${d.specialty})`;

                            opt.textContent = label;
                            docSelect.appendChild(opt);
                        });
                    }
                }

                // Hide "Meeting" option ONLY for Secretaries (user role)
                if (currentUser.role === 'user') {
                    const typeSelect = document.getElementById('eventType');
                    for (let i = 0; i < typeSelect.options.length; i++) {
                        if (typeSelect.options[i].value === 'meeting') {
                            typeSelect.options[i].disabled = true;
                            typeSelect.options[i].hidden = true;
                        }
                    }

                    // Hide File Upload for Secretaries
                    const fileInputDiv = document.getElementById('field-file-upload');
                    if (fileInputDiv) fileInputDiv.classList.add('hidden');
                }
            }
        } catch (e) { console.error("Role check failed", e); }

        // --- FullCalendar Setup ---
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            locale: 'fr',
            height: '100%',
            editable: true, // Enable Drag & Drop
            // Fix: Disable Drag & Drop in Month View to prevent scheduling errors
            eventAllow: function (dropInfo, draggedEvent) {
                if (calendar.view.type === 'dayGridMonth') {
                    return false;
                }
                return true;
            },
            eventDrop: function (info) {
                updateEventDates(info.event, info.revert);
            },
            eventResize: function (info) {
                updateEventDates(info.event, info.revert);
            },
            events: function (info, successCallback, failureCallback) {
                const token = localStorage.getItem('token');

                // Get Filter Values
                const doctorName = document.getElementById('searchDoctor').value;
                const eventType = document.getElementById('filterType').value;

                // Build Query Params
                const params = new URLSearchParams();
                if (doctorName) params.append('doctor_name', doctorName);
                if (eventType) params.append('event_type', eventType);
                // Note: FullCalendar sends start/end automatically in info (optional if backend filters by range, but here we load all for now or paginated)
                // If backend supports start/end filtering (it doesn't explicitly in my code yet, it resets to all), 
                // but usually FC expects range filtering. 
                // My backend `read_events` uses skip/limit and optional filters, but NOT date range. 
                // This means it loads ALL events (limit 100 default). 
                // For proper calendar scaling, we should add start_date/end_date filtering in backend too.
                // But for now, we leave as is.

                fetch(`/events/?${params.toString()}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                    .then(response => {
                        if (response.status === 401) {
                            window.location.href = '/login';
                            return;
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (!data) return; // Redirected
                        // Map backend events to FullCalendar format
                        const events = data.map(event => {
                            // 1. Color Coding by Type
                            let color = '#3b82f6'; // Default
                            let borderColor = '#2563eb';

                            switch (event.event_type) {
                                case 'consultation': color = '#3b82f6'; borderColor = '#2563eb'; break; // Blue
                                case 'surgery': color = '#ef4444'; borderColor = '#dc2626'; break; // Red
                                case 'meeting': color = '#a855f7'; borderColor = '#9333ea'; break; // Purple
                                case 'other': color = '#64748b'; borderColor = '#475569'; break; // Slate
                            }

                            // 2. Title Logic
                            // Secretary: "Dr Name - Patient Name"
                            // Doctor: "Patient Name"
                            // Default Dynamic Title Logic
                            let title = event.title;
                            const pName = event.patient ? `${event.patient.first_name} ${event.patient.last_name}` : 'Patient Inconnu';

                            if (event.event_type === 'meeting') {
                                title = "Réunion";
                            } else if (currentUser.role === 'user' || currentUser.role === 'admin' || currentUser.role === 'super_admin') {
                                // Secretary view
                                const dName = event.owner ? `${event.owner.first_name} ${event.owner.last_name}` : 'Non assigné';
                                title = `${dName} - ${pName}`;
                            } else if (currentUser.role === 'manager') {
                                // Doctor view
                                title = pName;
                            }

                            // --- Permission Logic for Editable ---
                            // Default true, but restrict specific cases
                            let isEditable = true;

                            // Restrict 'meeting' updates to Admin/SuperAdmin only
                            if (event.event_type === 'meeting') {
                                if (!['admin', 'super_admin'].includes(currentUser.role)) {
                                    isEditable = false;
                                }
                            }

                            return {
                                id: event.id,
                                title: title,
                                start: event.start_date,
                                end: event.end_date,
                                backgroundColor: color,
                                borderColor: borderColor,
                                editable: isEditable, // Override global editable
                                extendedProps: {
                                    description: event.description,
                                    files: event.files,
                                    is_public: event.is_public,
                                    is_approved: event.is_approved,
                                    owner_id: event.owner_id,
                                    event_type: event.event_type,
                                    patient: event.patient,
                                    owner: event.owner
                                }
                            };
                        });
                        successCallback(events);
                    })
                    .catch(error => {
                        console.error('Error fetching events:', error);
                        failureCallback(error);
                    });
            },
            eventClick: function (info) {
                openViewModal(info.event);
            },
            dateClick: function (info) {
                openModal();
                // Set default dates based on click
                // info.dateStr is YYYY-MM-DD for dayGrid

                // Helper to format date for datetime-local input (YYYY-MM-DDTHH:MM)
                const date = new Date(info.date);
                // Set start to 09:00 of clicked day
                date.setHours(9, 0);
                const startStr = date.toISOString().slice(0, 16); // Remove seconds

                // Set end to 10:00 of clicked day
                date.setHours(10, 0);
                const endStr = date.toISOString().slice(0, 16);

                const inputs = form.querySelectorAll('input[type="datetime-local"]');
                if (inputs.length >= 2) {
                    inputs[0].value = startStr;
                    inputs[1].value = endStr;
                }
            }
        });
        calendar.render();

        // --- Search & Filter Listeners ---
        const searchInput = document.getElementById('searchDoctor');
        const typeSelect = document.getElementById('filterType');

        // Debounce search input
        let timeout = null;
        searchInput.addEventListener('input', () => {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                calendar.refetchEvents();
            }, 300);
        });

        typeSelect.addEventListener('change', () => {
            calendar.refetchEvents();
        });

        // Helper: Get Local ISO String (Naive)
        function toLocalISOString(date) {
            const tzOffset = date.getTimezoneOffset() * 60000; // in milliseconds
            return new Date(date - tzOffset).toISOString().slice(0, -1);
        }

        // Helper: Update Event Dates via API
        async function updateEventDates(event, revertFunc) {
            const updates = {
                start_date: toLocalISOString(event.start),
                end_date: event.end ? toLocalISOString(event.end) : null
            };

            // If end is null (e.g. after resize/drop sometimes), calculate +1h fallback or let backend handle?
            // Backend handles "if end_date in update_data" -> replaces. If we send null, Pydantic might complain if not Optional?
            // Schema EventUpdate end_date is Optional[datetime].
            // If we send explicit null, it sets to null?
            // DB end_date is nullable=False.
            // Start is always present. End might be missing in FC event object if it's a timed event without explicit end?
            // Usually FC timed events have end. If not, we should probably compute it.
            if (!updates.end_date && event.start) {
                const d = new Date(event.start);
                d.setHours(d.getHours() + 1);
                updates.end_date = toLocalISOString(d);
            }

            try {
                // Determine owner for permission check (though backend checks it too)
                const res = await fetch(`/events/${event.id}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updates)
                });

                if (!res.ok) {
                    // Revert if error (e.g. conflict)
                    revertFunc();
                    let errMsg = "Erreur inconnue";
                    try {
                        const err = await res.json();
                        errMsg = err.detail || errMsg;
                    } catch (jsonErr) {
                        // Fallback if not JSON (e.g. 500 HTML)
                        errMsg = res.statusText;
                    }
                    alert("Erreur de déplacement: " + errMsg);
                }
            } catch (e) {
                revertFunc();
                console.error(e);
                alert("Erreur réseau: " + e.message);
            }
        }

        // --- Modal Logic ---
        const modal = document.getElementById('event-modal');
        const modalContent = document.getElementById('modal-content');
        const endInput = document.getElementById('eventEnd');

        // Auto-fill End Date (+1h) when Start changes
        const startInput = document.getElementById('eventStart');
        startInput.addEventListener('change', () => {
            if (startInput.value) {
                const d = new Date(startInput.value);
                d.setHours(d.getHours() + 1);

                // Manual format YYYY-MM-DDTHH:MM
                const pad = (n) => n < 10 ? '0' + n : n;
                const iso = d.getFullYear() + '-' +
                    pad(d.getMonth() + 1) + '-' +
                    pad(d.getDate()) + 'T' +
                    pad(d.getHours()) + ':' +
                    pad(d.getMinutes());

                endInput.value = iso;
            }
        });

        const btnAdd = document.getElementById('btn-add-event');
        const btnClose = document.getElementById('btn-close-modal');
        const form = document.getElementById('event-form');

        function openModal() {
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        }

        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            form.reset();
        }

        btnAdd.addEventListener('click', openModal);
        btnClose.addEventListener('click', closeModal);

        // Click outside to close
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // --- Form Submission ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            // Ensure ISO format for dates if needed, but datetime-local usually allows standard processing
            // Debug: console.log([...formData]);

            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/events/', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                if (response.ok) {
                    // Refresh calendar
                    calendar.refetchEvents();
                    closeModal();
                    alert('Événement créé avec succès !');
                } else {
                    const err = await response.json();
                    alert('Erreur: ' + JSON.stringify(err));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Erreur réseau');
            }
        });
        // --- View Modal Logic ---
        const viewModal = document.getElementById('view-modal');
        const viewContent = document.getElementById('view-content');
        // currentUser is already fetched at start of script

        window.openViewModal = (event) => {
            const props = event.extendedProps;
            const isManager = currentUser && ['admin', 'manager', 'super_admin'].includes(currentUser.role);
            // Secretary (user) can also manage events (delete/move), but maybe not "Approve" (logic specific)
            // Logic: Secretaries can Delete.
            let canDelete = currentUser && (
                currentUser.id === props.owner_id ||
                ['admin', 'manager', 'super_admin', 'user'].includes(currentUser.role)
            );

            // Special Restriction: Only Admin/SuperAdmin can delete meetings
            if (props.event_type === 'meeting' && !['admin', 'super_admin'].includes(currentUser.role)) {
                canDelete = false;
            }

            const canApprove = isManager && props.is_public && !props.is_approved;

            let html = `
                <h3 class="text-xl font-bold text-slate-800">${event.title}</h3>
                <div class="flex items-center gap-2 text-sm">
                    <span class="px-2 py-0.5 rounded text-white ${props.is_public ? (props.is_approved ? 'bg-emerald-500' : 'bg-amber-500') : 'bg-blue-500'}">
                        ${props.is_public ? (props.is_approved ? 'Public (Approuvé)' : 'Public (En attente)') : 'Privé'}
                    </span>
                    <span class="text-slate-500">${new Date(event.start).toLocaleString()}</span>
                </div>
                <p class="text-slate-600 bg-slate-50 p-3 rounded-lg">${props.description || 'Aucune description'}</p>
            `;

            if (props.files && props.files.length > 0) {
                html += `<div class="border-t pt-2 mt-2">
                    <p class="font-semibold text-sm mb-1">Fichiers:</p>
                    ${props.files.map(f => `<a href="${f.file_path}" target="_blank" class="text-indigo-600 hover:underline block text-sm"><i class="fas fa-paperclip"></i> ${f.file_name}</a>`).join('')}
                </div>`;
            }

            // Actions
            html += `<div class="flex gap-2 mt-4 pt-2 border-t border-slate-100">`;

            if (canApprove) {
                html += `<button onclick="approveEvent(${event.id})" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-bold">Approuver</button>`;
            }

            if (canDelete) {
                html += `<button onclick="deleteEvent(${event.id})" class="flex-1 bg-red-100 hover:bg-red-200 text-red-600 py-2 rounded-lg font-bold">Supprimer</button>`;
            }

            html += `</div>`;

            viewContent.innerHTML = html;
            viewModal.classList.remove('hidden');
        };

        window.closeViewModal = () => viewModal.classList.add('hidden');

        window.approveEvent = async (id) => {
            if (!confirm("Valider cet événement public ?")) return;
            try {
                const res = await fetch(`/events/${id}/approve`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                if (res.ok) {
                    closeViewModal();
                    calendar.refetchEvents();
                    alert("Evénement approuvé !");
                } else {
                    const err = await res.json();
                    alert("Erreur: " + (err.detail || "Inconnue"));
                }
            } catch (e) { console.error(e); }
        };

        window.deleteEvent = async (id) => {
            if (!confirm("Supprimer cet événement ?")) return;
            try {
                const res = await fetch(`/events/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                if (res.ok) {
                    closeViewModal();
                    calendar.refetchEvents();
                } else {
                    alert("Erreur lors de la suppression");
                }
            } catch (e) { console.error(e); }
        };

    });
</script>
{% endblock %}
