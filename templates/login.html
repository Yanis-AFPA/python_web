{% extends "base.html" %}

{% block title %}Connexion - AgendaPro{% endblock %}

{% block content %}
<div class="h-full flex items-center justify-center -mt-10">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <h2 class="text-2xl font-bold text-center mb-6 text-slate-800">Bienvenue sur AgendaPro</h2>

        <!-- Tabs -->
        <div class="flex border-b border-slate-200 mb-6">
            <button id="tab-login"
                class="flex-1 pb-2 text-indigo-600 font-medium border-b-2 border-indigo-600 transition-colors">Connexion</button>
            <button id="tab-register"
                class="flex-1 pb-2 text-slate-400 font-medium hover:text-slate-600 transition-colors">Inscription</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" name="username" required
                    class="w-full rounded-lg border-slate-200 focus:border-indigo-500 bg-slate-50 px-4 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
                <input type="password" name="password" required
                    class="w-full rounded-lg border-slate-200 focus:border-indigo-500 bg-slate-50 px-4 py-2 text-sm">
            </div>
            <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg shadow-lg shadow-indigo-500/20 mt-2">
                Se connecter
            </button>
        </form>

        <!-- Register Form (Hidden) -->
        <form id="register-form" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" name="email" required
                    class="w-full rounded-lg border-slate-200 focus:border-indigo-500 bg-slate-50 px-4 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
                <input type="password" name="password" required
                    class="w-full rounded-lg border-slate-200 focus:border-indigo-500 bg-slate-50 px-4 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Rôle</label>
                <select name="role"
                    class="w-full rounded-lg border-slate-200 focus:border-indigo-500 bg-slate-50 px-4 py-2 text-sm">
                    <option value="user">Utilisateur</option>
                    <option value="admin">Administrateur</option>
                </select>
            </div>
            <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg shadow-lg shadow-emerald-500/20 mt-2">
                Créer un compte
            </button>
        </form>

        <p id="error-msg" class="text-red-500 text-sm mt-4 text-center hidden"></p>
    </div>
</div>

<script>
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const formLogin = document.getElementById('login-form');
    const formRegister = document.getElementById('register-form');
    const errorMsg = document.getElementById('error-msg');

    // Tab switching
    tabLogin.onclick = () => {
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
        tabLogin.className = "flex-1 pb-2 text-indigo-600 font-medium border-b-2 border-indigo-600 transition-colors";
        tabRegister.className = "flex-1 pb-2 text-slate-400 font-medium hover:text-slate-600 transition-colors";
        errorMsg.classList.add('hidden');
    };
    tabRegister.onclick = () => {
        formLogin.classList.add('hidden');
        formRegister.classList.remove('hidden');
        tabRegister.className = "flex-1 pb-2 text-indigo-600 font-medium border-b-2 border-indigo-600 transition-colors";
        tabLogin.className = "flex-1 pb-2 text-slate-400 font-medium hover:text-slate-600 transition-colors";
        errorMsg.classList.add('hidden');
    };

    // Login logic
    formLogin.onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(formLogin);

        try {
            const res = await fetch('/api/v1/auth/login', {
                method: 'POST',
                body: formData // OAuth2PasswordRequestForm expects form data
            });
            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('token', data.access_token);
                window.location.href = '/calendar';
            } else {
                errorMsg.textContent = data.detail || "Erreur de connexion";
                errorMsg.classList.remove('hidden');
            }
        } catch (err) {
            errorMsg.textContent = "Erreur réseau";
            errorMsg.classList.remove('hidden');
        }
    };

    // Register logic
    formRegister.onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(formRegister);
        const json = Object.fromEntries(formData.entries());

        try {
            const res = await fetch('/api/v1/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(json)
            });

            if (res.ok) {
                alert("Compte créé ! Veuillez vous connecter.");
                tabLogin.click();
            } else {
                const data = await res.json();
                errorMsg.textContent = data.detail || "Erreur d'inscription";
                errorMsg.classList.remove('hidden');
            }
        } catch (err) {
            errorMsg.textContent = "Erreur réseau";
            errorMsg.classList.remove('hidden');
        }
    }
</script>
{% endblock %}
